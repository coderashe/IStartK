<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>iStart Capital</title>
    <script>
      var l = window.location;
      var base = '/IStartK';
      var path = l.pathname.slice(base.length) || '/';
      l.replace(
        l.protocol + '//' + l.host + base +
        '/?p=' + encodeURIComponent(path) + l.hash
      );
    </script>
  </head>
</html>
